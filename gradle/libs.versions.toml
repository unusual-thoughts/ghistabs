[versions]
# Floor is set by the oldest kotlin-stdlib among installed Ghidra extensions — see the
# `compilerOptions.apiVersion` note in build.gradle.kts before bumping.
kotlin = "2.3.21"
ktlint = "14.2.0"
kotlinxSerialization = "1.10.0"
junitJupiter = "6.1.3"
junit4 = "4.13.2"
clikt = "5.1.0"
detekt = "2.0.0-alpha.6"

[libraries]
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }

[bundles]
# junit-platform-launcher is deliberately not here: it belongs on testRuntimeOnly.
junit = ["junit-jupiter", "junit4"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
