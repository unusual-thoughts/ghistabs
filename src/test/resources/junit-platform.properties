# Within-JVM concurrency is OFF: each integration test class loads its own
# Ghidra program (autoanalysis + symbol-table mutations), and running two
# such classes in one JVM concurrently would race on the Ghidra Application
# singleton. Across-JVM parallelism is configured via build.gradle.kts
# (maxParallelForks).
junit.jupiter.execution.parallel.enabled=false

# Auto-register jupiter extensions declared in META-INF/services (ghistabs.LiveTestReporter, a
# TestWatcher that writes live per-test results incl. skip reasons to build/test-output/results).
junit.jupiter.extensions.autodetection.enabled=true