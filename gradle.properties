# A corpus run is ~25 min across maxParallelForks JVMs each doing full Ghidra autoanalysis; at
# default priority that makes the desktop unusable. Applies to the daemon and everything it forks,
# so the test workers inherit it.
org.gradle.priority=low

# The generated fixture tests are one multi-thousand-line file; codegen for it exhausts the Kotlin
# daemon's default heap ("Couldn't transform method node" / GC overhead limit) on a full recompile.
kotlin.daemon.jvmargs=-Xmx6g
