name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A newer push to the same PR supersedes the in-flight run. On main, only a force push
# cancels the in-flight run; ordinary pushes wait their turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event.forced || false }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write

    steps:
      - uses: actions/checkout@v7

      # The version the integration baselines were generated against; bumping it will shift counters.
      - uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: '12.3'
          repo: unusual-thoughts/ghidra

      - name: Check formatting
        run: ./gradlew ktlintCheck

      - name: Run static analysis
        id: detekt
        if: success() || failure()
        run: ./gradlew detekt

      - name: Upload detekt report
        if: steps.detekt.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: '**/build/reports/detekt/detekt.html'

      - name: Run unit tests
        run: ./gradlew test

      - name: Run integration tests
        run: ./gradlew integrationTest -Pmode=all -PignoreBaselines=true -Pshorten=true --fail-fast

      - name: Resolve commit under test
        id: commit_id
        if: success() || failure()
        run: echo "sha=$(echo '${{ github.event.pull_request.head.sha || github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Publish Test Report
        id: report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          include_passed: true
          include_skipped: true

      - name: Upload integration logs
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs-${{ steps.commit_id.outputs.sha }}.zip
          path: build/test-output/logs/

      - name: Check for shifted baselines
        id: shifted
        if: success() || failure()
        run: if [ -n "$(find . -path '*/build/test-output/shifted-baselines/*' -type f -print -quit)" ]; then echo found=true >> "$GITHUB_OUTPUT"; fi

      - name: Upload shifted baselines
        if: (success() || failure()) && steps.shifted.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: shifted-baselines-${{ steps.commit_id.outputs.sha }}.zip
          # Each project writes its own: the root's and ghicpp's.
          path: |
            build/test-output/shifted-baselines/
            */build/test-output/shifted-baselines/

      # A green run can still have shifted baselines; list which counters moved on the run's summary page.
      - name: Summarize moved baseline counters
        if: success() || failure()
        run: >-
          python3 .github/scripts/baseline_summary.py
          ${{ steps.shifted.outputs.found == 'true' && format('--artifact shifted-baselines-{0}.zip', steps.commit_id.outputs.sha) || '' }}
          >> "$GITHUB_STEP_SUMMARY"

      # ghicpp's on its own first: it must build without the stabs project.
      - name: Build zips
        run: |
          ./gradlew :ghicpp:buildExtension
          ./gradlew buildExtension packageCli

      - uses: ./.github/actions/upload-packages

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
