name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A newer push to the same PR supersedes the in-flight run. On main, only a force push
# cancels the in-flight run; ordinary pushes wait their turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event.forced || false }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write

    steps:
      - uses: actions/checkout@v7

      # The version the integration baselines were generated against; bumping it will shift counters.
      - uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: '12.3'
          repo: unusual-thoughts/ghidra

      - name: Check formatting
        run: ./gradlew ktlintCheck

      - name: Run static analysis
        id: detekt
        if: success() || failure()
        run: ./gradlew detekt

      - name: Upload detekt report
        if: steps.detekt.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: build/reports/detekt/detekt.html

      - name: Run unit tests
        run: ./gradlew test

      # Entries are named for the fixture, Ghidra build and analyzer bytecode that produced them (see
      # ghistabs.test.AnalysisCache), so restoring the newest cache is always safe: an entry this commit
      # no longer matches is re-analyzed and replaced. The primary key never exists; restore-keys picks
      # the latest save visible from this ref.
      - name: Restore analysis cache
        id: restore_analysis_cache
        uses: actions/cache/restore@v6
        with:
          path: build/analysis-cache
          key: analysis-cache-${{ github.sha }}
          restore-keys: analysis-cache-

      - name: Run integration tests
        run: ./gradlew integrationTest -Pmode=all -PignoreBaselines=true -Pshorten=true --fail-fast

      # Keyed by the entry names, which carry their content keys: a run that re-analyzed nothing
      # names the cache it restored, and saves nothing.
      - name: Fingerprint analysis cache
        id: analysis_cache
        if: success() || failure()
        run: |
          entries=$(find build/analysis-cache -maxdepth 1 -name '*.gzf' -printf '%f\n' 2>/dev/null | sort)
          if [ -n "$entries" ]; then echo "key=analysis-cache-$(echo "$entries" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"; fi

      - name: Save analysis cache
        if: >-
          (success() || failure()) && steps.analysis_cache.outputs.key != ''
          && steps.analysis_cache.outputs.key != steps.restore_analysis_cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: build/analysis-cache
          key: ${{ steps.analysis_cache.outputs.key }}

      - name: Resolve commit under test
        id: commit_id
        if: success() || failure()
        run: echo "sha=$(echo '${{ github.event.pull_request.head.sha || github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Publish Test Report
        id: report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          include_passed: true
          include_skipped: true

      - name: Upload integration logs
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs-${{ steps.commit_id.outputs.sha }}.zip
          path: build/test-output/logs/

      - name: Check for shifted baselines
        id: shifted
        if: success() || failure()
        run: if [ -n "$(ls -A build/test-output/shifted-baselines 2>/dev/null)" ]; then echo found=true >> "$GITHUB_OUTPUT"; fi

      - name: Upload shifted baselines
        if: (success() || failure()) && steps.shifted.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: shifted-baselines-${{ steps.commit_id.outputs.sha }}.zip
          path: build/test-output/shifted-baselines/

      - name: Build zips
        run: ./gradlew buildExtension packageCli

      - uses: ./.github/actions/upload-packages

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
