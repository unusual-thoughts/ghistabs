name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghidra: '10.4'
            java: '17' # last release before Ghidra moved to 21
          - ghidra: '11.4.3'
            java: '21'
          - ghidra: '12.0.4'
            java: '21'
          - ghidra: '12.1.3'
            java: '21'

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-ghidra
      with:
        ghidra-version: ${{ matrix.ghidra }}
        java-version: ${{ matrix.java }}

    - name: Run unit tests
      run: ./gradlew test

    - name: Build zips
      run: ./gradlew buildExtension packageCli

    - name: Publish to the release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: | # Whichever matrix job gets here first creates the release; the rest race and lose harmlessly.
        gh release view "$TAG" >/dev/null 2>&1 ||
          gh release create "$TAG" --verify-tag --generate-notes || true
        gh release upload "$TAG" dist/*.zip --clobber

    # workflow_dispatch creates artifacts even if there is no release tag
    - name: Upload packages
      uses: actions/upload-artifact@v7
      with:
        name: packages-ghidra-${{ matrix.ghidra }}
        path: dist/*.zip
