name: Release

# One extension zip per supported Ghidra release. `buildExtension` already stamps the Ghidra version
# into the zip name, so all of them can live in a single GitHub release without colliding.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghidra: '10.4'
            java: '17' # last release before Ghidra moved to 21
          - ghidra: '11.4.3'
            java: '21'
          - ghidra: '12.0.4'
            java: '21'
          - ghidra: '12.1.3'
            java: '21'

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-ghidra
      with:
        ghidra-version: ${{ matrix.ghidra }}
        java-version: ${{ matrix.java }}

    - name: Run unit tests
      run: ./gradlew test

    - name: Build zips
      run: ./gradlew buildExtension packageCli

    # One step per zip: `archive: false` uploads the file as-is rather than zipping the zip, and so
    # takes a path matching exactly one file.
    - name: Upload extension zip
      uses: actions/upload-artifact@v7
      with:
        name: extension-ghidra-${{ matrix.ghidra }}
        path: dist/ghidra_*.zip
        archive: false

    - name: Upload CLI zip
      uses: actions/upload-artifact@v7
      with:
        name: cli-ghidra-${{ matrix.ghidra }}
        path: dist/ghistabs-cli_*.zip
        archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Collect packages
      uses: actions/download-artifact@v8
      with:
        pattern: '*-ghidra-*'
        merge-multiple: true
        path: dist

    - name: Publish release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*.zip
        generate_release_notes: true
