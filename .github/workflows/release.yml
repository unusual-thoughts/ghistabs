name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghidra: '10.4'
            java: '17' # last release before Ghidra moved to 21
          - ghidra: '11.4.3'
            java: '21'
          - ghidra: '12.0.4'
            java: '21'
          - ghidra: '12.1.3'
            java: '21'
          - ghidra: '12.2'
            java: '21'
          # Custom build with a.out fixes
          - ghidra: '12.3'
            java: '21'
            repo: unusual-thoughts/ghidra

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ matrix.ghidra }}
          java-version: ${{ matrix.java }}
          repo: ${{ matrix.repo }}

      # Teed, so the steps below can annotate what the compiler said.
      - name: Test and build zips
        shell: bash
        run: ./gradlew --warning-mode all test buildExtension packageCli 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Compile errors first, then warnings, each in a step of its own: GitHub keeps 10 of each per step.
      - name: Annotate compile errors
        if: failure()
        run: python3 .github/scripts/build_warnings.py "$RUNNER_TEMP/build.log" --kind error

      - name: Annotate compiler warnings
        if: success() || failure()
        run: python3 .github/scripts/build_warnings.py "$RUNNER_TEMP/build.log" --kind compiler

      - name: Annotate Gradle deprecations
        if: success() || failure()
        run: python3 .github/scripts/build_warnings.py "$RUNNER_TEMP/build.log" --kind gradle

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: | # Whichever matrix job gets here first creates the release; the rest race and lose harmlessly.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes || true
          gh release upload "$TAG" dist/*.zip ghicpp/dist/*.zip --clobber

      # workflow_dispatch creates artifacts even if there is no release tag
      - uses: ./.github/actions/upload-packages
