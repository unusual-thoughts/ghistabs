name: Build and test Ghidra Extension

env:
  GHIDRA_VERSION: '12.1.2'
  GHIDRA_RELEASE: PUBLIC
  GHIDRA_DATE: '20260605'

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install ghidra
      run: |
        GHIDRA_ZIP="ghidra_${GHIDRA_VERSION}_${GHIDRA_RELEASE}_${GHIDRA_DATE}.zip" &&
        wget "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${GHIDRA_ZIP}" &&
        mkdir -p /opt/ &&
        unzip ${GHIDRA_ZIP} &&
        mv ghidra_${GHIDRA_VERSION}_${GHIDRA_RELEASE} /opt/ghidra

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Check formatting
      run: ./gradlew ktlintCheck

    - name: Run static analysis
      id: detekt
      if: success() || failure()
      run: ./gradlew detekt

    - name: Upload detekt report
      if: steps.detekt.conclusion == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: detekt-report
        path: build/reports/detekt/detekt.html

    - name: Run unit tests
      run: ./gradlew test

    - name: Run integration tests
      run: ./gradlew integrationTest -Pmode=all -PignoreBaselines=true --fail-fast

    - name: Publish Test Report
      id: report
      uses: mikepenz/action-junit-report@v6
      if: success() || failure() # always run even if the previous step fails
      with:
        report_paths: '**/build/test-results/**/TEST-*.xml'

    - name: Check for shifted baselines
      id: shifted
      if: success() || failure()
      run: if [ -n "$(ls -A build/test-output/shifted-baselines 2>/dev/null)" ]; then echo found=true >> "$GITHUB_OUTPUT"; fi

    - name: Upload shifted baselines
      if: steps.shifted.outputs.found == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: shifted-baselines.zip
        path: build/test-output/shifted-baselines/

    - name: Build zips
      run: ./gradlew buildExtension packageCli

    - name: Upload extension zip
      uses: actions/upload-artifact@v7
      with:
        name: extension and CLI packages
        path: dist/ghidra_*.zip
        archive: false

    - name: Upload CLI zip
      uses: actions/upload-artifact@v7
      with:
        name: extension and CLI packages
        path: dist/ghistabs-cli.zip
        archive: false

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v6
